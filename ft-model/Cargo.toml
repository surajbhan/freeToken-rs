[package]
name = "ft-model"
version = "0.1.0"
edition = "2021"

[dependencies]
ft-core = { path = "../ft-core" }
ft-cuda = { path = "../ft-cuda" }
ft-gguf = { path = "../ft-gguf" }
cudarc.workspace = true
rayon.workspace = true
half.workspace = true
anyhow.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
futures = "0.3"
